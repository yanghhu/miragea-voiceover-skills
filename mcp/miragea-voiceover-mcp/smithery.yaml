# Smithery configuration: https://smithery.ai/docs/build/project-config
startCommand:
  type: stdio
  configSchema:
    type: object
    required: [apiKey]
    properties:
      apiKey:
        type: string
        title: Miragea API key
        description: Create it at https://miragea.ai/workspace/api
      outputDir:
        type: string
        title: Output folder
        description: Where generated WAV / SRT files are written
  commandFunction: |-
    (config) => ({
      command: 'python3',
      args: ['miragea_voiceover_mcp/server.py'],
      env: Object.assign({ MIRAGEA_API_KEY: config.apiKey }, config.outputDir ? { MIRAGEA_OUTPUT_DIR: config.outputDir } : {})
    })
  exampleConfig:
    apiKey: your-api-key
